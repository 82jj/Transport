name: Transport isolation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - name: Build each project with only its own directory
        run: |
          for app in user captain admin api; do
            docker build -t "transport-$app:ci" "apps/$app"
          done
  browser:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated browser test tools
        run: |
          python3 -m venv /tmp/transport-ui-env
          /tmp/transport-ui-env/bin/pip install playwright==1.57.0
          /tmp/transport-ui-env/bin/playwright install --with-deps chromium webkit
      - name: Exercise the actual interfaces with isolated API fixtures
        env:
          TEST_WEBKIT: '1'
        run: |
          /tmp/transport-ui-env/bin/python tests/concept-five-browser.py
          /tmp/transport-ui-env/bin/python tests/onboarding-browser.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: concept-five-browser
          path: artifacts
          retention-days: 7
  live-isolation:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify the actual public URLs and deployed assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: npm run smoke:live
  live-browser:
    needs: [live-isolation, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test tools
        run: |
          python3 -m venv /tmp/transport-ui-env
          /tmp/transport-ui-env/bin/pip install playwright==1.57.0
          /tmp/transport-ui-env/bin/playwright install --with-deps chromium webkit
      - name: Render both public apps without production writes
        env:
          TEST_WEBKIT: '1'
        run: /tmp/transport-ui-env/bin/python tests/concept-five-browser.py --live
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: concept-five-live
          path: artifacts
          retention-days: 7
