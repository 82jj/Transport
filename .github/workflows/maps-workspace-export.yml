name: Maps workspace export
on:
  push:
    branches: [feat/live-maps]
    paths: [.github/workflows/maps-workspace-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: maps-source
          path: source.zip
          retention-days: 1
